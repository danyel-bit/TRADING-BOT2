name: Morning Review

on:
  schedule:
    - cron: '0 13 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run morning review
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python review_and_tune.py

      - name: Commit updated strategy + review log
        run: |
          git config user.name "constellation-bot"
          git config user.email "actions@github.com"
          git add strategy_state.json logs/
          git commit -m "Morning review for $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
