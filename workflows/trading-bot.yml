name: Daily Paper Trading Bot

on:
  schedule:
    # Runs shortly after US market close (4:00pm ET).
    # Two entries cover both daylight saving offsets (EDT/EST) — the bot itself
    # skips the second run if it already ran today, so this is safe either way.
    - cron: '30 20 * * 1-5'   # ~4:30pm EDT
    - cron: '30 21 * * 1-5'   # ~4:30pm EST
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python trading_bot.py

      - name: Commit today's log
        run: |
          git config user.name "constellation-bot"
          git config user.email "actions@github.com"
          git add logs/
          git commit -m "Trading log for $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
